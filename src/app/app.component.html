
<ion-app>

  <ion-split-pane contentId="main-content" when="md" [disabled]="isAdminRoute">

    <ion-menu
      *ngIf="!isAdminRoute"
      contentId="main-content"
      type="overlay"
      menuId="main-menu">

      <ion-content>

        <!-- SIDEBAR HEADER -->
        <div class="sidebar-header">

          <ion-icon name="business-outline" class="logo-icon"></ion-icon>

          <h1>CJK</h1>
          <p>Hotel Reservation</p>

          <div class="profile-section">
            <ion-icon name="person-circle" class="profile-icon"></ion-icon>

            <div class="profile-info">
              <h3>{{ firstName }} {{ lastName }}</h3>
              <p>Customer</p>
            </div>

            <ion-icon name="chevron-down-outline"></ion-icon>
          </div>

        </div>

        <!-- MENU ITEMS -->
        <ion-list class="menu-list">

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/home" routerLinkActive="selected" lines="none">
              <ion-icon name="home" slot="start"></ion-icon>
              <ion-label>Home</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/rooms" routerLinkActive="selected" lines="none">
              <ion-icon name="bed" slot="start"></ion-icon>
              <ion-label>Rooms</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/my-bookings" routerLinkActive="selected" lines="none">
              <ion-icon name="calendar" slot="start"></ion-icon>
              <ion-label>My Bookings</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/profile" routerLinkActive="selected" lines="none">
              <ion-icon name="person" slot="start"></ion-icon>
              <ion-label>Profile</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/about" routerLinkActive="selected" lines="none">
              <ion-icon name="information-circle" slot="start"></ion-icon>
              <ion-label>About</ion-label>
            </ion-item>
          </ion-menu-toggle>

        </ion-list>

      </ion-content>

      <!-- LOGOUT BUTTON -->
      <ion-footer class="menu-footer">
        <ion-toolbar>
          <ion-button (click)="logout()">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            Logout
          </ion-button>
        </ion-toolbar>
      </ion-footer>

    </ion-menu>

    <!-- MAIN CONTENT -->
    <div class="ion-page" id="main-content">
      <ion-router-outlet></ion-router-outlet>
    </div>

  </ion-split-pane>

</ion-app>
