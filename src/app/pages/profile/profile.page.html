<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">profile</ion-title>
    </ion-toolbar>
  </ion-header>

 
  <ion-card>
    <ion-card-content>
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-img src="https://i.pinimg.com/1200x/65/ab/50/65ab50e0f166f78d14ced864e866f120.jpg" alt="bg"></ion-img>

      <ion-card-title>{{ fullName }}</ion-card-title>
      <ion-card-subtitle>Customer</ion-card-subtitle>
    </ion-card-content>
  </ion-card>

  
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="person-outline"></ion-icon>
        Personal Information
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-label>Full Name: {{ fullName }}</ion-label>
      <br><br>

      <ion-label>Email Address: {{ email }}</ion-label>
      <br><br>

      <ion-label>Username: {{ username }}</ion-label>
    </ion-card-content>
  </ion-card>
</ion-content>
